        run: gradle assembleDebug --no-daemon
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GameLibrary.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Biblioteca de juegos (última versión)
          files: GameLibrary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-APK
          path: GameLibrary.apk
