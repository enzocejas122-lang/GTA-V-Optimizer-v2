name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p app/src/main/java/com/nahz/gamelibrary app/src/main/assets
          best=""; bt=0
          for f in index*.html; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ -n "$t" ] && [ "$t" -ge "$bt" ]; then bt=$t; best="$f"; fi
          done
          echo "Usando: $best"
          cp "$best" app/src/main/assets/index.html
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GameLibrary"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nahz.gamelibrary"
              compileSdk = 34

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      storeType = "pkcs12"
                  }
              }

              defaultConfig {
                  applicationId = "com.nahz.gamelibrary"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Biblioteca de juegos"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/nahz/gamelibrary/MainActivity.kt <<'EOF'
          package com.nahz.gamelibrary

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import rikka.shizuku.Shizuku
          import kotlin.math.abs

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private val pkgRegex = Regex("^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$")

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#080d18"))
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = WebViewClient()
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  try {
                      Shizuku.addBinderReceivedListenerSticky { notifyState() }
                      Shizuku.addBinderDeadListener { notifyState() }
                      Shizuku.addRequestPermissionResultListener { _, _ -> notifyState() }
                  } catch (e: Throwable) {
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              private fun notifyState() {
                  web.post { web.evaluateJavascript("window.__shz&&window.__shz()", null) }
              }

              private fun toJs(msg: String) {
                  web.post {
                      web.evaluateJavascript("window.__native&&window.__native(" + JSONObject.quote(msg) + ")", null)
                  }
              }

              private fun granted(): Boolean = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) {
                  false
              }

              // Ejecuta un comando con permisos de shell a traves de Shizuku (sin pasar por "sh -c").
              private fun sh(vararg args: String): String {
                  return try {
                      val m = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      m.isAccessible = true
                      val p = m.invoke(null, arrayOf(*args), null, null) as Process
                      val out = p.inputStream.bufferedReader().readText()
                      val err = p.errorStream.bufferedReader().readText()
                      val code = p.waitFor()
                      val txt = (out + err).trim().ifEmpty { "ok" }
                      if (code != 0) "$txt (codigo $code)" else txt
                  } catch (e: Throwable) {
                      "Error: " + (e.cause?.message ?: e.message ?: e.javaClass.simpleName)
                  }
              }

              // Resolucion (25-100 %) -> factor de reduccion del modo juego de Android.
              private fun downscale(res: Int): String {
                  if (res >= 95) return "disable"
                  val v = (Math.round(res / 5.0) * 5).toInt().coerceIn(30, 90)
                  return (v / 100.0).toString()
              }

              // FPS -> valor admitido por el modo juego (30, 45, 60, 90, 120).
              private fun fpsToken(fps: Int): String =
                  listOf(30, 45, 60, 90, 120).minByOrNull { abs(it - fps) }.toString()

              private fun launchPkg(pkg: String): Boolean {
                  val intent = packageManager.getLaunchIntentForPackage(pkg) ?: return false
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  runOnUiThread { startActivity(intent) }
                  return true
              }

              inner class Bridge {
                  // Abre una app instalada por su paquete. Devuelve false si no existe o no tiene lanzador.
                  @JavascriptInterface
                  fun launch(pkg: String): Boolean = pkgRegex.matches(pkg) && launchPkg(pkg)

                  // Lista las apps instaladas con lanzador: [{name, pkg}, ...]
                  @JavascriptInterface
                  fun apps(): String {
                      val pm = packageManager
                      val query = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val arr = JSONArray()
                      for (r in pm.queryIntentActivities(query, 0)) {
                          arr.put(
                              JSONObject()
                                  .put("name", r.loadLabel(pm).toString())
                                  .put("pkg", r.activityInfo.packageName)
                          )
                      }
                      return arr.toString()
                  }

                  // "ok" = listo, "denied" = falta el permiso, "off" = Shizuku no esta activo.
                  @JavascriptInterface
                  fun shizukuState(): String = try {
                      if (!Shizuku.pingBinder()) "off"
                      else if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) "ok"
                      else "denied"
                  } catch (e: Throwable) {
                      "off"
                  }

                  @JavascriptInterface
                  fun shizukuRequest() {
                      runOnUiThread {
                          try {
                              Shizuku.requestPermission(100)
                          } catch (e: Throwable) {
                          }
                      }
                  }

                  // Aplica resolucion y FPS al juego (modo juego de Android) y lo abre.
                  @JavascriptInterface
                  fun applyAndLaunch(pkg: String, fps: Int, res: Int) {
                      if (!pkgRegex.matches(pkg)) {
                          toJs("Paquete no valido")
                          return
                      }
                      Thread {
                          val log = StringBuilder()
                          if (!granted()) {
                              log.append("Shizuku no esta conectado: se abre sin aplicar ajustes.\n")
                          } else {
                              val ds = downscale(res)
                              val f = fpsToken(fps)
                              var r = sh("cmd", "game", "set", "--mode", "performance", "--downscale", ds, "--fps", f, pkg)
                              if (r.contains("rror") || r.contains("xception") || r.contains("nknown")) {
                                  log.append("set (performance): $r\n")
                                  r = sh("cmd", "game", "set", "--mode", "2", "--downscale", ds, "--fps", f, pkg)
                              }
                              log.append("set: $r\n")
                              log.append("mode: " + sh("cmd", "game", "mode", "performance", pkg) + "\n")
                              log.append("config: " + sh("cmd", "game", "list-configs", pkg) + "\n")
                              log.append("pedido: reduccion $ds, FPS $f\n")
                          }
                          log.append(if (launchPkg(pkg)) "Abriendo el juego..." else "No encontre ese juego instalado")
                          toJs(log.toString().take(700))
                      }.start()
                  }

                  // Quita lo aplicado al juego en el sistema.
                  @JavascriptInterface
                  fun resetGame(pkg: String) {
                      if (!pkgRegex.matches(pkg)) {
                          toJs("Paquete no valido")
                          return
                      }
                      Thread { toJs("reset: " + sh("cmd", "game", "reset", pkg)) }.start()
                  }
              }
          }
